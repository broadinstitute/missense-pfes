[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "missense-pfes"
version = "0.1.1"
description = "Protein Feature Enrichment Score (PFES) for missense variant interpretation"
readme = "README.md"
authors = [
    { name = "Seulki Kwon",   email = "skwon@broadinstitute.org" },
    { name = "Sumaiya Iqbal", email = "sumaiya@broadinstitute.org" },
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "requests",
    "tqdm",
    "g2papi",
]

[project.scripts]
pfes = "pfes.scorer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pfes = ["templates/*.j2"]
